<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearClip: save TikTok and Instagram videos</title>
  <meta name="description" content="Paste a TikTok or Instagram link and save the original video in the best quality available.">
  <meta name="theme-color" content="#E9F3F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A2A32" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFB627'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%230C3B46'/%3E%3C/svg%3E">

  <!-- Optional: fonts. Delete these three lines to go fully dependency-free (system fonts are used as fallback). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="wrap top">
    <a class="brand" href="./" aria-label="ClearClip home">
      <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#FFB627"/>
        <path d="M12 9.5v13l11-6.5z" fill="#0C3B46"/>
      </svg>
      <span>ClearClip</span>
    </a>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>Save any clip without the watermark.</h1>
      <p>Pick TikTok or Instagram, paste the link, and get the original video in the best quality available.</p>
    </section>

    <form id="form" class="tool" novalidate>

      <fieldset class="platform">
        <legend>Platform</legend>
        <div class="seg">
          <input type="radio" name="platform" id="p-tiktok" value="TikTok" checked>
          <label for="p-tiktok">TikTok</label>
          <input type="radio" name="platform" id="p-instagram" value="Instagram">
          <label for="p-instagram">Instagram</label>
        </div>
      </fieldset>

      <div id="frame" class="frame">
        <span class="c tl" aria-hidden="true"></span>
        <span class="c tr" aria-hidden="true"></span>
        <span class="c bl" aria-hidden="true"></span>
        <span class="c br" aria-hidden="true"></span>
        <div class="mark" aria-hidden="true"></div>
        <div class="sweep" aria-hidden="true"></div>

        <div class="frame-body">
          <span id="pill" class="pill" data-state="idle">Paste a TikTok link</span>
          <div class="field">
            <label class="sr-only" for="link">Video link</label>
            <input id="link" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="https://www.tiktok.com/@user/video/…">
            <button id="paste" class="paste" type="button">Paste</button>
          </div>
        </div>
      </div>

      <button id="go" class="go" type="submit">Get video</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="result" class="result"></div>
    </form>

    <noscript><p class="status err">ClearClip needs JavaScript to work.</p></noscript>
  </main>

  <footer class="wrap foot">
    <p>Public videos only. For personal use; respect creators’ rights and each platform’s terms of service.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
